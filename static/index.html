:root {
  /* Messenger-Spiel im IFAF-Design: Orange #F58220 aus ifaf-berlin.de, Petrol, Lila, Koralle, Text #212121. Telefon in der Mitte. */
  --bg: #f1f1f1;
  --bg2: #ffffff;
  --orange: #f58220;
  --phone: #f6f6f6;
  --card: #ffffff;
  --ink: #212121;
  --muted: #5f6064;
  --line: #e2e2e2;
  --signal: #f58220;
  --me: #212121;
  --m-z: #4ea2b3;
  --m-v: #3f9b6e;
  --m-r: #fe6748;
  --m-a: #8076a0;
  --good: #2e7d5b;
  --bad: #c0392b;
  --font-display: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 900; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }

/* Bühne */
.stage { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.side-r { display: none; }
.poster { display: none; }
.phone { height: 100%; height: 100dvh; min-width: 0; display: flex; flex-direction: column; background: var(--phone); overflow: hidden; position: relative; }
@media (min-width: 900px) {
  body { background: radial-gradient(1200px 600px at 20% 10%, var(--bg2), var(--bg)); }
  .stage { grid-template-columns: minmax(0, 1fr) 440px minmax(0, 1fr); gap: 40px; padding: 20px 32px; align-items: center; }
  .poster { display: grid; gap: 22px; color: var(--ink); justify-self: end; max-width: 420px; }
  .poster .logo svg { width: 260px; height: auto; }
  .poster h1 { font-size: clamp(2.4em, 3.6vw, 3.6em); line-height: 1; }
  .poster h1 mark { background: var(--orange); color: #fff; padding: 0 0.1em; border-radius: 6px; }
  .poster p { margin: 0; font-size: 1.15em; color: var(--muted); }
  .poster .kaibig svg { width: 150px; height: 150px; }
  .poster a { color: var(--ink); font-weight: 800; }
  .poster small { color: #8a8a8a; }
  .phone { height: min(880px, calc(100vh - 40px)); border-radius: 38px; box-shadow: 0 0 0 10px #212121, 0 30px 80px rgba(0,0,0,.5); }
  .side-r { display: block; justify-self: start; }
  .playqr { display: grid; gap: 10px; justify-items: center; background: #fff; border-radius: 18px; padding: 18px; text-align: center; max-width: 240px; }
  .playqr .qr img, .playqr .qr canvas { width: 170px; height: 170px; }
  .playqr small { color: var(--muted); }
  .dock { padding: 10px 18px 22px; }
  .ph-head { padding: 14px 18px 10px; }
}

/* Kopfzeile */
.ph-head { flex: none; background: var(--ink); color: #fff; padding: 10px 14px 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.ph-row { display: flex; align-items: center; gap: 10px; }
.ph-row .who { flex: 1; min-width: 0; }
.ph-row .who b { display: block; font-family: var(--font-display); font-size: 1.08em; }
.ph-row .who small { display: block; color: #cfcfcf; font-size: 0.8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-row svg.kai { width: 38px; height: 38px; flex: none; }
.hbtn { background: transparent; border: 1.5px solid #5a5a5a; color: #fff; border-radius: 999px; padding: 4px 11px; font-size: 0.82em; font-weight: 700; }
.meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.prog { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; color: rgba(255,255,255,.85); }
.prog .pb { height: 6px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
.prog .pb i { display: block; height: 100%; border-radius: 99px; background: var(--orange); transition: width .5s ease; }
.prog span { white-space: nowrap; }
.mm .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 420px) { .mm .w { display: none; } }
.mm { display: grid; gap: 3px; font-size: 0.8em; color: #d9d9d9; }
.mm .t { display: flex; justify-content: space-between; }
.mm .t b { color: #fff; font-variant-numeric: tabular-nums; }
.mm .bar { height: 7px; border-radius: 99px; background: #4a4a4a; overflow: hidden; }
.mm .bar i { display: block; height: 100%; border-radius: 99px; transition: width .6s ease; }
.mm.pulse-good .t b { color: #6be3b4; }
.mm.pulse-bad .t b { color: #ff8f88; }

/* Chat */
.chat { flex: 1 1 0; min-height: 0; position: relative; overflow-y: auto; padding: 14px 12px 18px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
.chat > * { flex-shrink: 0; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; animation: pop .18s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg .av { width: 30px; height: 30px; flex: none; }
.msg .av svg { width: 30px; height: 30px; }
.bubble { background: var(--card); border-radius: 16px 16px 16px 4px; padding: 9px 13px; max-width: 82%; box-shadow: 0 1px 0 rgba(19,32,58,.08); }
.msg.me { justify-content: flex-end; }
.msg.me .bubble { background: var(--orange); color: var(--ink); font-weight: 700; border-radius: 16px 16px 4px 16px; }
.msg.other .bubble { background: #ffe5df; }
.msg.other .from { display: block; font-size: 0.75em; font-weight: 700; color: var(--bad); margin-bottom: 2px; }
.ini { width: 30px; height: 30px; border-radius: 50%; background: var(--bad); color: #fff; display: grid; place-items: center; font-size: 0.72em; font-weight: 700; flex: none; }
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9aa6bb; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
.sys { align-self: center; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; font-size: 0.8em; font-weight: 700; }
.sys span { background: #fff; border-radius: 99px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
.sys .good { color: var(--good); } .sys .bad { color: var(--bad); }
.factline { align-self: center; max-width: 92%; font-size: 0.82em; color: var(--muted); background: #fff1e6; border-radius: 10px; padding: 6px 10px; }
.factbtn { align-self: center; background: #fff1e6; border: 1.5px solid #f9c08f; border-radius: 12px; padding: 6px 12px; font-size: 0.85em; font-weight: 700; text-align: left; max-width: 92%; }
.factbtn p { margin: 6px 0 0; font-weight: 400; }

/* Artefakte */
.art { margin-left: 38px; max-width: calc(100% - 46px); width: 300px; background: #fff; border-radius: 14px; border: 1.5px solid var(--line); overflow: hidden; font-size: 0.88em; animation: pop .2s ease-out; }
.art .ah { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f6f8fb; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 0.82em; color: var(--muted); }
.art .ab { padding: 10px 12px; display: grid; gap: 6px; }
.art .row { display: flex; justify-content: space-between; gap: 10px; }
.art .row span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.art .sub { color: var(--muted); font-size: 0.9em; }
.art .total { border-top: 2px solid var(--ink); padding-top: 6px; font-weight: 700; }
.art .stamp { justify-self: end; border: 2px solid var(--bad); color: var(--bad); border-radius: 6px; padding: 0 8px; font-weight: 700; font-size: 0.8em; transform: rotate(-4deg); text-transform: uppercase; letter-spacing: .05em; }
.art .mailrow { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.art .unread { display: grid; grid-template-columns: 8px 1fr; gap: 8px; align-items: start; }
.art .unread i { width: 8px; height: 8px; border-radius: 50%; background: var(--m-z); margin-top: 6px; }
.art.call { background: linear-gradient(160deg, #3a3a3a, #212121); color: #fff; border: none; text-align: center; }
.art.call .ab { padding: 18px 12px; gap: 4px; }
.art.call .ring { width: 54px; height: 54px; border-radius: 50%; margin: 6px auto; display: grid; place-items: center; font-size: 1.5em; background: #3f9b6e; animation: ring 1.2s infinite; }
.art.call.out .ring { background: var(--m-z); }
@keyframes ring { 0%,100% { box-shadow: 0 0 0 0 rgba(22,145,106,.6); } 70% { box-shadow: 0 0 0 14px rgba(22,145,106,0); } }
.lights { display: flex; gap: 8px; font-weight: 700; }
.lights span { flex: 1; border-radius: 8px; padding: 6px; text-align: center; }
.chipsrow { display: flex; flex-wrap: wrap; gap: 4px; }
.chipsrow span { background: #58595b; color: #fff; border-radius: 6px; padding: 1px 6px; font-size: 0.85em; font-weight: 700; }
.ad { background: var(--ink); color: #fff; border: none; }
.ad .brand { font-family: var(--font-display); font-weight: 900; font-size: 1.5em; color: var(--orange); }
.ad .fine { font-size: 0.72em; color: #8a8a8a; }
.notice { border: 2px solid var(--ink); }
.notice .sender { font-weight: 700; }
.notice .aiflag { font-size: 0.88em; color: var(--muted); }

/* Ergebnis */
.result { align-self: stretch; margin: 6px 0; background: #fff; border-radius: 18px; border: 2px solid var(--ink); padding: 16px; display: grid; gap: 10px; text-align: center; animation: pop .25s ease-out; }
.badge { width: 86px; height: 86px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font-size: 2.6em; box-shadow: 0 0 0 6px #fff, 0 0 0 9px var(--ink); }
.result h2 { font-size: 1.8em; }
.result .k { font-size: 0.75em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.result p { margin: 0; }
.prof { display: flex; gap: 4px; justify-content: center; }
.prof span { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 1em; }
.thesis { background: #fff1e6; border-radius: 12px; padding: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.1em; }
.res-note { font-size: 0.85em; color: var(--muted); }
.tscale { border-top: 1px dashed #d9d9d9; padding-top: 10px; display: grid; gap: 8px; }
.tscale .th { font-weight: 800; font-size: .9em; }
.tscale .tax { display: flex; justify-content: space-between; font-size: .7em; color: var(--muted); font-weight: 700; }
.tscale .trow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; position: relative; padding-top: 6px; }
.tscale .trow::before { content: ""; position: absolute; left: 12%; right: 12%; top: 26px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, #b3b3b3, #3f9b6e, #f58220, #fe6748); }
.tchip { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; font: inherit; color: inherit; min-width: 0; }
.tchip .te { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 3px solid var(--tc); font-size: 19px; transition: transform .2s; }
.tchip .tn { font-size: .66em; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.tchip.me .te { background: var(--tc); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); transform: scale(1.1); }
.tchip.sel .te { outline: 2px dashed var(--ink); outline-offset: 3px; }
.tchip .tyou { position: absolute; top: -6px; left: calc(50% + 10px); background: var(--ink); color: #fff; font-size: .6em; font-weight: 800; padding: 1px 6px; border-radius: 99px; }
.tscale .trow2 { display: flex; align-items: center; justify-content: center; gap: 8px; }
.tscale .trow2 .tchip { flex-direction: row; gap: 6px; }
.tscale .trow2 .tchip .te { width: 32px; height: 32px; font-size: 15px; }
.tscale .trow2 .tchip .tyou { top: -8px; left: 18px; }
.tscale .tnote { font-size: .68em; color: var(--muted); text-align: left; max-width: 12em; }
.tscale .tdesc { font-size: .82em; min-height: 2.6em; margin: 0; background: #f6f6f6; border-radius: 10px; padding: 8px 10px; text-align: left; }

/* Start */
.intro { flex: 1 1 0; min-height: 0; overflow-y: auto; display: grid; align-content: center; gap: 16px; padding: 24px 22px calc(24px + env(safe-area-inset-bottom)); background: #fff; text-align: center; }
.intro .logo svg { width: 210px; max-width: 70%; height: auto; }
.intro .kaibig svg { width: 96px; height: 96px; }
.intro h1 { font-size: 2em; line-height: 1.05; }
.intro h1 mark { background: var(--orange); color: #fff; padding: 0 .12em; border-radius: 6px; }
h1 .ha { display: block; font-size: .58em; line-height: 1.15; margin-bottom: .18em; }
h1 mark { -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.intro p { margin: 0; color: var(--muted); }
.intro .frame { background: #fff1e6; border-left: 5px solid var(--orange); border-radius: 10px; padding: 10px 12px; text-align: left; color: var(--ink); font-size: .92em; }
.intro .start { background: var(--orange); color: var(--ink); border: none; border-radius: 16px; padding: 14px; font-weight: 900; font-size: 1.2em; min-height: 56px; }
.intro .langrow { display: flex; justify-content: center; gap: 8px; }
.intro small { color: var(--muted); }
/* Kontakt */
.contact { align-self: stretch; background: #fff; border-radius: 18px; border: 2px solid var(--orange); padding: 14px 16px; display: grid; gap: 8px; animation: pop .25s ease-out; }
.contact h3 { font-size: 1.15em; }
.contact p { margin: 0; font-size: .9em; }
.contact .sep { font-size: .8em; color: var(--muted); text-align: center; }
.contact .qr { justify-self: center; background: #fff; padding: 6px; }
.contact .qr img, .contact .qr canvas { width: 140px; height: 140px; }
.sender { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: .78em; }
.sender svg { width: 130px; height: auto; }

/* Antwortleiste */
.dock { flex: none; background: #fff; border-top: 1px solid var(--line); padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); display: grid; gap: 8px; max-height: 58%; overflow-y: auto; }
.dock:empty { display: none; }
.ans { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; text-align: left; background: var(--phone); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; min-height: 52px; font-weight: 700; transition: transform .08s ease, background .1s ease; }
.ans:hover { background: #fff1e6; }
.ans:active { transform: scale(.98); }
.ans .ic { font-size: 1.25em; width: 1.4em; text-align: center; }
.kb { font-size: 0.72em; color: var(--muted); border: 1.5px solid var(--line); border-radius: 5px; padding: 0 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--phone); border: 2px solid var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 700; min-height: 44px; }
.chip:hover { background: #fff1e6; }
.skip { justify-self: center; background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 0.85em; padding: 4px; }
.primary { background: var(--ink); color: #fff; border: none; border-radius: 14px; padding: 12px; font-weight: 700; font-size: 1.05em; min-height: 52px; }
.primary.y { background: var(--orange); color: var(--ink); }
a.primary { display: grid; place-items: center; text-decoration: none; }
.scen { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; text-align: left; background: #fff; border: 2px solid var(--ink); border-radius: 16px; padding: 10px 12px; box-shadow: 0 3px 0 var(--ink); }
.scen svg { width: 52px; height: 52px; }
.scen b { display: block; font-family: var(--font-display); font-size: 1.1em; }
.scen small { color: var(--muted); }
.meta { text-align: center; font-size: 0.78em; color: var(--muted); }
@media (pointer: coarse) { .kb { display: none; } }

/* Statistik */
.stats { min-height: 100%; background: #f1f1f1; padding: 22px clamp(16px, 3vw, 40px) 40px; display: grid; gap: 18px; align-content: start; }
.stats-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.stats-head h1 { font-size: clamp(1.9em, 3.4vw, 3em); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { border: 2px solid var(--ink); background: transparent; border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 0.85em; }
.pill[aria-pressed="true"] { background: var(--ink); color: #fff; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tile { background: #fff; border-radius: 16px; border: 2px solid var(--ink); padding: 16px 18px; display: grid; gap: 4px; align-content: start; }
.tile .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2em, 3.6vw, 3em); line-height: 1; font-variant-numeric: tabular-nums; }
.tile .cap { color: var(--muted); font-size: 0.9em; }
.panels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.panel { background: #fff; border-radius: 16px; border: 1px solid var(--line); padding: 16px 18px; display: grid; gap: 10px; align-content: start; }
.panel h2 { font-size: 1.12em; }
.hrow { display: grid; grid-template-columns: minmax(0, 1.4fr) 2fr 4.6em; gap: 10px; align-items: center; font-size: 0.88em; }
.hrow .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.hrow small { display: block; color: var(--muted); font-size: 0.85em; }
.hbar { height: 14px; border-radius: 4px; background: #f1f1f1; overflow: hidden; }
.hbar i { display: block; height: 100%; background: var(--orange); border-radius: 4px; transition: width .5s ease; }
.note { color: var(--muted); font-size: 0.82em; margin: 0; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vs div { border-radius: 12px; padding: 10px; background: #f1f1f1; text-align: center; }
.vs b { display: block; font-family: var(--font-display); font-size: 2em; font-variant-numeric: tabular-nums; }
@media (max-width: 1100px) { .panels { grid-template-columns: 1fr 1fr; } }
@media (max-width: 700px) { .panels, .tiles { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

  /**

  qrcode.createStringToBytes = function(unicodeData, numChars) {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  function clamp(x) { return Math.max(0, Math.min(100, x)); }
  function applyFx(m, fx) {
    const out = Object.assign({}, m);
    for (const k of ["z", "v", "r", "a"]) if (fx && fx[k]) out[k] = clamp(out[k] + fx[k]);
    return out;
  }
  function summarize(m, ch) {
    const lv = ch.filter(c => typeof c.l === "number").map(c => c.l);
    return { m, n5: ch.filter(c => c.l === 5).length, nSafe: ch.filter(c => c.s).length,
      avg: lv.length ? lv.reduce((a, b) => a + b, 0) / lv.length : null };
  }

<script>
/* Stand-Bildschirm („#bildschirm“): animiertes Plakat mit großem QR-Code zum Mitspielen am Handy.
   Läuft nur, wenn die Adresse mit #bildschirm aufgerufen wird; dann startet das Spiel nicht (app.js prüft window.__POSTER). */
(function () {
  "use strict";
  if (location.hash !== "#bildschirm") return;
  window.__POSTER = true;
  const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PLAY_URL = location.href.split("#")[0].split("?")[0];
  const SHORT = PLAY_URL.replace(/^https?:\/\//, "").replace(/\/$/, "");

  /* ---------- Kai (wie im Spiel) ---------- */
  function kai(mood) {
    const W = 'stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"';
    const eyes = {
      happy: `<path d="M21 30 q4.5 -6 9 0 M34 30 q4.5 -6 9 0" ${W}/>`,

      wink: `<path d="M21 30 q4.5 -6 9 0" ${W}/><circle cx="38.5" cy="29" r="3.2" fill="#fff"/>`,
      blink: `<path d="M21 30 h9 M34 30 h9" ${W}/>`
    };
    const mouth = {
      happy: `<path d="M25 37 q7 7 14 0" ${W}/>`, smug: `<path d="M26 39 q8 2 13 -4" ${W}/>`,
      oops: `<path d="M26 40 q3 -3 6 0 t6 0" ${W}/>`, wink: `<path d="M25 37 q7 7 14 0" ${W}/>`, blink: `<path d="M26 39 q8 2 13 -4" ${W}/>`
    };
    const m = eyes[mood] ? mood : "happy";
    return `<svg viewBox="0 0 64 64" aria-hidden="true">
      <line x1="32" y1="5" x2="32" y2="13" stroke="#212121" stroke-width="3"/>
      <circle class="ant" cx="32" cy="5" r="4" fill="#f58220" stroke="#212121" stroke-width="2.5"/>

      <rect x="14" y="19" width="36" height="31" rx="9" fill="#212121"/>${eyes[m]}${mouth[m]}</svg>`;
  }

  /* ---------- QR-Code: abgerundete Module, Kai in der Mitte (Fehlerkorrektur H) ---------- */
  function qrSvg(text) {
    if (!window.qrcode) return "";
    const q = window.qrcode(0, "H"); q.addData(text); q.make();
    const n = q.getModuleCount(), Z = 4, S = n + 2 * Z;
    const ver = (n - 17) / 4;
    const L = ver < 7 ? 7 : 0;                       /* Logo nur, wenn kein Ausrichtungsmuster in der Mitte liegt */
    const c0 = Math.floor((n - L) / 2), c1 = c0 + L;
    const inFinder = (r, c) => (r < 8 && c < 8) || (r < 8 && c >= n - 8) || (r >= n - 8 && c < 8);
    const inLogo = (r, c) => L && r >= c0 - 1 && r < c1 + 1 && c >= c0 - 1 && c < c1 + 1;
    let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!q.isDark(r, c) || inFinder(r, c) || inLogo(r, c)) continue;
      d += `<rect x="${c + Z + .05}" y="${r + Z + .05}" width=".9" height=".9" rx=".22"/>`;
    }
    const finder = (x, y) => `<rect x="${x + Z}" y="${y + Z}" width="7" height="7" rx="1.3"/><rect x="${x + Z + 1}" y="${y + Z + 1}" width="5" height="5" rx=".8" fill="#fff"/><rect x="${x + Z + 2}" y="${y + Z + 2}" width="3" height="3" rx=".5"/>`;
    const logo = L ? `<g transform="translate(${c0 + Z - .6} ${c0 + Z - .6}) scale(${(L + 1.2) / 64})"><rect x="0" y="0" width="64" height="64" rx="16" fill="#fff"/>${kai("smug").replace(/<\/?svg[^>]*>/g, "")}</g>` : "";
    return `<svg class="qrsvg" viewBox="0 0 ${S} ${S}" role="img" aria-label="QR-Code: ${SHORT}" shape-rendering="geometricPrecision">
      <rect width="${S}" height="${S}" fill="#fff"/><g fill="#212121">${d}${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</g>${logo}</svg>`;
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function typesSlide(feed, av) {
    av.innerHTML = kai("wink");

    const tys = [...feed.querySelectorAll(".ty")];
    for (let k = 0; k < TYPES.length; k++) {
      tys.forEach((el, j) => el.classList.toggle("on", j === k));
      $("ptyd").textContent = `${TYPES[k].e} ${TYPES[k].n}: ${TYPES[k].d}`;
      await sleep(RM ? 2500 : 1900);
    }
    await sleep(500);
    [...feed.children].forEach(el => el.classList.add("fade"));
    await sleep(500);
  }
  async function chatLoop() {
    const feed = $("pfeed"), av = $("pav");
    let i = Math.floor(Math.random() * LINES.length), round = 0;
    for (;;) {
      if (round++ % 3 === 2) { await typesSlide(feed, av); continue; }
      const L = LINES[i % LINES.length]; i++;
      const ch = CHIPS[Math.floor(Math.random() * CHIPS.length)];
      feed.innerHTML = `<div class="ctx">${L.ctx}</div><div class="bub typing"><i></i><i></i><i></i></div>`;
      av.innerHTML = kai("smug");
      await sleep(RM ? 300 : 1300);
      feed.lastElementChild.outerHTML = `<div class="bub">${L.ask}</div>`;
      await sleep(1700);
      feed.insertAdjacentHTML("beforeend", `<div class="chips">${CHIPS.map(c => `<span class="chip">${c.t}</span>`).join("")}</div>`);
      await sleep(1300);
      const chip = [...feed.querySelectorAll(".chip")][CHIPS.indexOf(ch)];
      chip.classList.add("on"); chip.insertAdjacentHTML("beforeend", `<span class="finger">👆</span>`);
      await sleep(1100);
      feed.querySelector(".chips").remove();
      feed.insertAdjacentHTML("beforeend", `<div class="bub me">${ch.t}</div>`);
      await sleep(900);
      av.innerHTML = kai(ch.mood);
      feed.insertAdjacentHTML("beforeend", `<div class="bub">${ch.kai}</div>`);
      await sleep(2600);
      [...feed.children].forEach(el => el.classList.add("fade"));
      await sleep(500);
    }
  }
  function stepsLoop() {
    const s = [...$("psteps").querySelectorAll("span")]; let k = 0;
    setInterval(() => { s.forEach((el, j) => el.classList.toggle("on", j === k)); k = (k + 1) % s.length; }, 1600);
  }
  function blinkLoop() {
    const p = $("peek");
    const go = () => { p.innerHTML = kai("blink"); setTimeout(() => { p.innerHTML = kai(Math.random() < .5 ? "wink" : "happy"); }, 180); setTimeout(go, 2500 + Math.random() * 3000); };
    setTimeout(go, 2000);
  }
  function screenHelpers() {
    const pst = $("pst"), hint = $("phint");
    setTimeout(() => hint.classList.add("hide"), 6000);
    let t = null;
    const wake = () => { pst.classList.remove("nocursor"); clearTimeout(t); t = setTimeout(() => pst.classList.add("nocursor"), 3000); };
    document.addEventListener("mousemove", wake); wake();
    let lock = null;
    const keepAwake = async () => { try { if (navigator.wakeLock && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } } catch (e) {} };
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
    pst.addEventListener("click", () => {
      keepAwake();
      try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) {}
    });
    keepAwake();
    window.addEventListener("hashchange", () => location.reload());
  }

  function start() { build(); stepsLoop(); screenHelpers(); if (!RM) blinkLoop(); chatLoop(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

  };
  const LVLC = { 1: "#b3b3b3", 2: "#4ea2b3", 3: "#3f9b6e", 4: "#f58220", 5: "#fe6748", p: "#8076a0" };

  function t(o, vars) {

  function T(o, v) { return esc(t(o, v)); }
  function dayStr(d) { return new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Berlin" }).format(d || new Date()); }
  function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }

  const sleep = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));

  /* ---------- Kai ---------- */

  const ICONS = {
    stone: `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#f1f1f1"/><rect x="8" y="38" width="48" height="16" rx="3" fill="#b3b3b3" stroke="#212121" stroke-width="3"/><rect x="16" y="22" width="32" height="16" rx="3" fill="#e2e2e2" stroke="#212121" stroke-width="3"/><path d="M25 22 L30 12 L39 12 L43 22" fill="#f58220" stroke="#212121" stroke-width="3" stroke-linejoin="round"/></svg>`,
    truck: `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#e4f2f5"/><rect x="6" y="20" width="32" height="24" rx="3" fill="#fff" stroke="#212121" stroke-width="3"/><path d="M38 27 H49 L57 36 V44 H38 Z" fill="#f58220" stroke="#212121" stroke-width="3" stroke-linejoin="round"/><circle cx="17" cy="47" r="5" fill="#212121"/><circle cx="48" cy="47" r="5" fill="#212121"/><path d="M22 25 V39 M15 32 H29 M17 27 L27 37 M27 27 L17 37" stroke="#4ea2b3" stroke-width="2.5" stroke-linecap="round"/></svg>`,
    cookie: `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#fff1e6"/><circle cx="32" cy="33" r="20" fill="#e3a35d" stroke="#212121" stroke-width="3"/><circle cx="25" cy="27" r="3" fill="#5a3416"/><circle cx="38" cy="25" r="2.6" fill="#5a3416"/><circle cx="36" cy="38" r="3.2" fill="#5a3416"/><circle cx="24" cy="39" r="2.4" fill="#5a3416"/><circle cx="31" cy="32" r="1.8" fill="#5a3416"/></svg>`,
    app: `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#fff1e6"/><rect x="18" y="7" width="28" height="50" rx="6" fill="#fff" stroke="#212121" stroke-width="3"/><path d="M26 37 L36 25 M34 22 a4 4 0 1 0 5 5" stroke="#212121" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="32" cy="51" r="2.2" fill="#212121"/><circle cx="47" cy="12" r="7" fill="#f58220" stroke="#212121" stroke-width="3"/></svg>`
  };

  /* ---------- Speicher: claude.ai jetzt, eigener Server später ----------
     Jede Runde hat eine feste ID (sid-ts). Nicht gespeicherte Runden liegen in localStorage
     und werden alle 20 s erneut gesendet; doppelte Sendungen überschreiben sich nur. */
  const Store = (function () {
    const listeners = [];
    let status = "loading", docs = [], local = [];
    const notify = () => listeners.forEach(f => { try { f(); } catch (e) {} });
    const PKEY = "bsw-pending";
    const readPending = () => { try { return JSON.parse(localStorage.getItem(PKEY) || "[]"); } catch (e) { return []; } };
    const writePending = list => { try { localStorage.setItem(PKEY, JSON.stringify(list)); } catch (e) {} };
    let pendingMem = readPending();
    const pending = () => pendingMem;
    const setPending = list => { pendingMem = list; writePending(list); };
    const merged = () => {
      if (status !== "live") return local.concat(pending().filter(p => !local.some(l => l.id === p.id)));
      const ids = new Set(docs.map(d => d.id));
      return docs.concat(pending().filter(p => !ids.has(p.id)));
    };
    let sendOne = null;
    async function flush() {
      if (!sendOne) return;
      for (const doc of pending().slice()) {
        const ok = await sendOne(doc);
        if (ok) setPending(pending().filter(p => p.id !== doc.id));
      }
    }
    setInterval(() => { flush(); }, 20000);
    const api = (window.BSW_CONFIG || {}).api;
    if ((window.BSW_CONFIG || {}).local) {
      /* Statisch: alle Runden in localStorage dieses Geräts (Stand-Laptop sammelt, Export über die Statistik) */
      const LKEY = "bsw-plays-v3";
      const readAll = () => { try { const a = JSON.parse(localStorage.getItem(LKEY) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
      docs = readAll(); status = "live";
      const FORM = (window.BSW_CONFIG || {}).formUrl, ENTRY = (window.BSW_CONFIG || {}).formEntry;
      sendOne = async doc => {
        try { const all = readAll().filter(d => d.id !== doc.id); all.push(doc); localStorage.setItem(LKEY, JSON.stringify(all)); docs = all; notify(); }
        catch (e) { if (!FORM) return false; }
        if (!FORM) return true;
        /* anonyme Runde an die Sammelstelle (Google-Formular → Tabelle); bei Netzfehler bleibt sie in der Warteschlange */
        try { const body = new URLSearchParams(); body.set(ENTRY, JSON.stringify(doc)); await fetch(FORM, { method: "POST", mode: "no-cors", body }); return true; }
        catch (e) { return false; }
      };
      window.addEventListener("storage", e => { if (e.key === LKEY) { docs = readAll(); notify(); } });
      setTimeout(() => { notify(); flush(); }, 0);
    } else if (api) {
      /* REST auf eigenem Server: PUT /plays/:id (idempotent), GET /plays → [docs] */
      const poll = async () => {
        try { const r = await fetch(api + "/plays"); if (r.ok) { docs = await r.json(); status = "live"; notify(); } } catch (e) { if (status !== "live") { status = "slow"; notify(); } }
      };
      sendOne = async doc => {
        try { const r = await fetch(api + "/plays/" + encodeURIComponent(doc.id), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(doc) }); return r.ok; } catch (e) { return false; }
      };
      poll(); setInterval(poll, 15000); flush();
    } else {
      (async () => {
        let db = null;
        try { db = (typeof claude !== "undefined" && claude.use) ? await claude.use("db") : null; } catch (e) { db = null; }
        if (!db) { status = "offline"; notify(); return; }
        sendOne = async doc => { try { await db.collection("plays").doc(doc.id).set(doc); return true; } catch (e) { return false; } };
        const slowTimer = setTimeout(() => { if (status === "loading") { status = "slow"; notify(); } }, 10000);
        try {
          db.collection("plays").onSnapshot(snap => {
            docs = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
            clearTimeout(slowTimer); status = "live"; notify();
          }, () => { clearTimeout(slowTimer); status = "offline"; notify(); });
        } catch (e) { status = "offline"; notify(); }
        flush();
      })();
    }
    return {
      status: () => status, all: merged, onChange: f => listeners.push(f), pendingCount: () => pending().length,
      add(doc) {
        local.push(doc);
        setPending(pending().filter(p => p.id !== doc.id).concat([doc]));
        notify();
        return flush();
      }
    };
  })();

  /* ---------- Sitzung ---------- */
  let RUN = 0;
  let S = null;
  function newSession(keep) {
    RUN++;
    S = { run: RUN, started: !!keep, sid: keep ? keep.sid : rid(), prof: keep ? keep.prof : null, rn: keep ? keep.rn + 1 : 1, log: [], dock: null, mood: "happy", typing: false,
      sc: null, m: Object.assign({}, G.START), ch: [], sw: null, t0: Date.now() };
  }
  function alive(run) { if (!S || S.run !== run) throw ABORT; }
  function scen() { return S.sc === "kids" ? G.KIDS : G.SCENARIOS.find(s => s.id === S.sc); }
  const MINOR = ["u15", "15-17", "u13", "13-17", "u18"];
  function isMinor() { return !!(S.prof && MINOR.includes(S.prof.alter)); }
  function isKid() { return !!(S.prof && (S.prof.alter === "u15" || S.prof.alter === "u13")); }

  /* ---------- Rendern ---------- */
  function route() { return location.hash === "#statistik" ? "statistik" : "spiel"; }
  function render() {
    document.documentElement.lang = lang;
    document.title = t(UI.title);
    if (route() === "statistik") { root.innerHTML = viewStats(); bindStats(); return; }
    root.innerHTML = `<div class="stage">
      <aside class="poster">
        <div class="logo">${window.IFAF_LOGO || ""}</div>
        <div class="kaibig">${kaiSvg("smug")}</div>
        <h1><span class="ha">${T(UI.heroA)}</span><mark>${T(UI.heroB)}</mark></h1>
        <p>${T(UI.poster)}</p>
        <small>${T(UI.posterSmall)}</small>
        <a href="#statistik">${T(UI.stats)} →</a>
      </aside>
      <div class="phone">${S.started ? `
        <header class="ph-head" id="head"></header>
        <div class="chat" id="chat" aria-live="polite"></div>
        <div class="dock" id="dock"></div>` : introHtml()}
      </div>
      <div class="side-r">${(window.BSW_CONFIG || {}).playUrl ? `<div class="playqr"><b>${T(UI.playPhone)}</b><div class="qr" data-qr="${esc(absUrl(window.BSW_CONFIG.playUrl))}"></div><small>${esc(absUrl(window.BSW_CONFIG.playUrl).replace(/^https?:\/\//, "").replace(/\/$/, ""))}</small></div>` : ""}</div>
    </div>`;
    setTimeout(drawQr, 50);
    if (!S.started) { bindIntro(); return; }
    renderHead(); renderChat(); renderDock();
  }
  function introHtml() {
    return `<section class="intro">
      <div class="logo">${window.IFAF_LOGO || "IFAF Berlin"}</div>
      <div class="kaibig">${kaiSvg("smug")}</div>
      <h1><span class="ha">${T(UI.heroA)}</span><mark>${T(UI.heroB)}</mark></h1>
      <p>${T(UI.introText)}</p>
      <div class="frame">${t(UI.introFrame)}</div>
      <p>${T(UI.introMeta)}</p>
      <button class="start" id="btnStart">${T(UI.start)}</button>
      <div class="langrow"><button class="pill" data-lang="de" aria-pressed="${lang === "de"}">DE</button><button class="pill" data-lang="en" aria-pressed="${lang === "en"}">EN</button></div>
      <small>${T(UI.bsw)} · KI-InnoX · IFAF Berlin</small>
    </section>`;
  }
  function bindIntro() {
    document.getElementById("btnStart").onclick = beginGame;
    root.querySelectorAll(".intro [data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("bsw-lang", lang); } catch (e) {} render(); });
  }
  function beginGame() {
    if (S.started) return;
    S.started = true; render(); runFlow(intro);
  }
  function renderHead() {
    const el = document.getElementById("head"); if (!el) return;
    const sc = S.sc ? scen() : null;
    const status = S.typing ? t(UI.typing) : (sc ? `${t(sc.name)} · ${t(sc.tag)}` : t(UI.online));
    el.innerHTML = `<div class="ph-row">${kaiSvg(S.mood, "kai")}
        <div class="who"><b>Kai</b><small>${esc(status)}</small></div>
        <button class="hbtn" id="btnLang" aria-label="${lang === "de" ? "Sprache: Englisch" : "Language: German"}">${lang === "de" ? "EN" : "DE"}</button>
        <button class="hbtn" id="btnNew" title="${T(UI.restart)}">⟲ ${T(UI.restart)}</button>
      </div>
      ${sc ? `<div class="meters">${["z", "v", "r", "a"].map(k => meterHtml(k)).join("")}</div>${progHtml()}` : ""}`;
    document.getElementById("btnLang").onclick = () => { lang = lang === "de" ? "en" : "de"; try { localStorage.setItem("bsw-lang", lang); } catch (e) {} render(); };
    document.getElementById("btnNew").onclick = () => startNew();
  }
  /* Fortschritt: alle Antworten einer Runde (Profil, Entscheidungen, Gründe), damit niemand kurz vor Schluss aufgibt */
  function progTotal() {
    const sc = scen(); if (!sc) return 0;
    const steps = sc.steps.length;
    const whyN = sc.steps.filter(st => st.type !== "seite" && st.why).length - (S.whyMissed || 0);
    const postN = S.rn === 1 && !isKid() ? G.PROFILE_POST.filter(q => !(q.skipIfMinor && isMinor())).length : 0;
    return (S.preN || 0) + steps + whyN + postN;
  }
  function progHtml() {
    const total = progTotal(); if (!total) return "";
    const done = Math.min(S.qDone || 0, total), left = total - done;
    const pct = S.finished ? 100 : Math.round(done / total * 100);
    const lab = S.finished || !left ? T(UI.progDone) : left === 1 ? T(UI.progLeft1) : t(UI.progLeft, { n: left });
    return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${esc(lab)}">
      <div class="pb"><i style="width:${pct}%"></i></div><span>${lab} · ${pct} %</span></div>`;
  }
  const MLAB = { z: { i: "⏱", de: "Zeit", en: "Time" }, v: { i: "🤝", de: "Vertrauen", en: "Trust" }, r: { i: "⚠️", de: "Risiko", en: "Risk" }, a: { i: "🔗", de: "Abhängig", en: "Lock-in" } };
  function meterHtml(k) {
    const v = Math.round(S.m[k]);
    return `<div class="mm" id="mm-${k}"><div class="t"><span>${MLAB[k].i} <span class="w">${T(MLAB[k])}</span></span><b>${v}</b></div><div class="bar"><i style="width:${v}%;background:var(--m-${k})"></i></div></div>`;
  }
  function flashMeters(before, after) {
    renderHead();
    ["z", "v", "r", "a"].forEach(k => {
      const d = after[k] - before[k]; if (!d) return;
      const good = (k === "z" || k === "v") ? d > 0 : d < 0;
      const el = document.getElementById("mm-" + k); if (!el) return;
      el.classList.add(good ? "pulse-good" : "pulse-bad");
      setTimeout(() => el.classList.remove("pulse-good", "pulse-bad"), 1600);
    });
  }

  function msgHtml(m, i) {
    switch (m.t) {
      case "kai": return `<div class="msg"><div class="av">${kaiSvg(m.mood)}</div><div class="bubble">${T(m.text)}</div></div>`;
      case "me": return `<div class="msg me"><div class="bubble">${m.icon ? esc(m.icon) + " " : ""}${T(m.text)}</div></div>`;
      case "other": return `<div class="msg other"><div class="ini">${esc(initials(m.from))}</div><div class="bubble"><span class="from">${esc(m.from)}</span>${T(m.text)}</div></div>`;
      case "art": return artHtml(m.art, m.cond);
      case "sys": return `<div class="sys">${m.d.map(x => `<span class="${x.good ? "good" : "bad"}">${MLAB[x.k].i} ${T(MLAB[x.k])} ${x.v > 0 ? "+" : "−"}${Math.abs(x.v)}</span>`).join("")}</div>`;
      case "fact": return `<div class="factline">💡 ${T(m.text)}</div>`;
      case "result": return resultHtml(m);
      case "contact": return contactHtml();
      case "typing": return `<div class="msg"><div class="av">${kaiSvg("think")}</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`;
    }
    return "";
  }
  function initials(n) { return String(n).split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(); }
  function renderChat() {
    const el = document.getElementById("chat"); if (!el) return;
    el.innerHTML = S.log.map(msgHtml).join("") + (S.typing ? msgHtml({ t: "typing" }) : "");
    setTimeout(drawQr, 50);
    const r = el.querySelectorAll(".result");
    if (r.length && S.dock && S.dock.spec.kind === "end") { const last = r[r.length - 1]; requestAnimationFrame(() => { el.scrollTop = last.offsetTop - 12; }); return; }
    el.onclick = ev => {
      const b = ev.target.closest("[data-fact]"); if (!b) return;
      const m = S.log[+b.dataset.fact]; m.open = !m.open; b.outerHTML = msgHtml(m, +b.dataset.fact);
    };
    scrollDown();
  }
  function scrollDown() {
    const el = document.getElementById("chat"); if (!el) return;
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
  }
  function push(m) {
    S.log.push(m);
    const el = document.getElementById("chat"); if (!el) return;
    const ty = el.querySelector(".typing"); if (ty) ty.closest(".msg").remove();
    el.insertAdjacentHTML("beforeend", msgHtml(m, S.log.length - 1));
    if (S.typing) el.insertAdjacentHTML("beforeend", msgHtml({ t: "typing" }));
    if (m.t === "result") { const r = el.querySelectorAll(".result"); const last = r[r.length - 1]; requestAnimationFrame(() => { el.scrollTop = last.offsetTop - 12; }); }
    else if (m.t !== "contact") scrollDown();
    if (m.t === "contact") setTimeout(drawQr, 50);
  }
  function setTyping(on) {
    S.typing = on; renderHead();
    const el = document.getElementById("chat"); if (!el) return;
    const ty = el.querySelector(".typing");
    if (on && !ty) el.insertAdjacentHTML("beforeend", msgHtml({ t: "typing" }));
    if (!on && ty) ty.closest(".msg").remove();
    scrollDown();
  }
  async function kai(text, mood, run) {
    alive(run);
    setTyping(true);
    const len = t(text).length;
    await sleep(320 + Math.min(750, len * 11));
    alive(run);
    S.mood = mood || "happy";
    setTyping(false);
    push({ t: "kai", text, mood: S.mood });
    renderHead();
  }

  /* Artefakte */
  function artHtml(a, cond) {

      case "offer": return `<div class="art"><div class="ah">📄 ${T(UI.offer)} · ${esc(scName)}</div><div class="ab">

      case "contract": return `<div class="art"><div class="ah">📑 ${T(a.title)}</div><div class="ab"><div class="sub">${T(UI.pages)}</div>

    if (!S.dock) return;

  function renderDock() {
    const el = document.getElementById("dock"); if (!el) return;
    if (!S.dock) { el.innerHTML = ""; return; }

    let h = "";

      h = G.SCENARIOS.map((s, i) => `<button class="scen" data-v="${s.id}">${ICONS[s.icon]}<span><b>${T(s.name)}</b><small>${T(s.tag)}</small></span><span class="kb">${i + 1}</span></button>`).join("")
        + `<div class="meta">${T(UI.privacy)}</div>`;
    } else if (sp.kind === "answers") {
      h = sp.items.map((o, i) => `<button class="ans" data-v="${i}"><span class="ic">${esc(o.icon || "")}</span><span>${T(o.label)}</span><span class="kb">${i + 1}</span></button>`).join("");
    } else if (sp.kind === "chips") {
      h = `<div class="chips">${sp.items.map((o, i) => `<button class="chip" data-v="${i}">${esc(t(o))} <span class="kb">${i + 1}</span></button>`).join("")}</div>` + (sp.skip ? `<button class="skip" data-v="-1">${T(UI.skip)} <span class="kb">0</span></button>` : "");
    } else if (sp.kind === "next") {

      h = KIOSK
        ? `<button class="primary y" data-v="person">${T(UI.nextPerson)}</button><button class="primary" data-v="again">${T(isKid() ? UI.againKid : UI.againSame)}</button>`
        : `<button class="primary y" data-v="again">${T(isKid() ? UI.againKid : UI.again)}</button>${isKid() ? "" : `<a class="skip" href="#statistik">${T(UI.seeStats)}</a>`}`;
    }

  /* ---------- Ablauf ---------- */
  async function intro(run) {
    await kai(UI.hi1, "happy", run);
    await kai(UI.hi2, "smug", run);
    /* Alter zuerst: bis 14 Jahre gibt es die Kinderversion (Schülerfirma), ohne Datenspeicherung */
    if (!S.prof) {
      S.prof = {};

      await askProfile([G.PROFILE_PRE[0]], run);

  function shuffled(n) {
    const a = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  async function askProfile(list, run) {
    for (const q of list) {
      if (q.skipIfMinor && isMinor()) { S.prof[q.id] = null; continue; }
      await kai(q.q, "happy", run);
      const k = await ask({ kind: "chips", items: q.opts, skip: true }); alive(run);
      if (k >= 0) { S.prof[q.id] = q.opts[k].id; push({ t: "me", text: { de: q.opts[k].de, en: q.opts[k].en } }); }
      else S.prof[q.id] = null;
    }
  }
  async function profilePre(run) {
    if (!S.prof) S.prof = {};
    const open = G.PROFILE_PRE.filter(q => !(q.id in S.prof));
    if (!open.length) return;
    await kai(open.length === 1 ? UI.prof1One : UI.prof1, "happy", run);
    await askProfile(open, run);
    await kai(UI.profDone, "happy", run);
  }
  async function profilePost(run) {
    const n = G.PROFILE_POST.filter(q => !(q.skipIfMinor && isMinor())).length;
    await kai(t(UI.prof2, { n }), "happy", run);
    await askProfile(G.PROFILE_POST, run);
    await kai(UI.profDone, "happy", run);

  async function play(id, run) {
    S.sc = id; S.m = Object.assign({}, G.START); S.ch = []; S.sw = null; S.t0 = Date.now();
    if (!S.prof) S.prof = {};
    S.qDone = 0; S.whyMissed = 0; S.finished = false;
    S.preN = isKid() ? 0 : G.PROFILE_PRE.filter(q => !(q.id in S.prof)).length;
    const sc = scen();
    push({ t: "me", icon: "", text: sc.name });
    renderHead();
    if (!isKid()) await profilePre(run);
    for (const line of sc.hello) await kai(line, "happy", run);
    for (const st of sc.steps) {
      if (st.type === "seite") await side(st, run); else await decision(st, run);
    }
    await finish(run);

  function deltas(before, after) {
    return ["z", "v", "r", "a"].map(k => ({ k, v: Math.round(after[k] - before[k]) })).filter(x => x.v)
      .map(x => Object.assign(x, { good: (x.k === "z" || x.k === "v") ? x.v > 0 : x.v < 0 }));
  }
  async function decision(st, run) {
    for (const line of st.kai) await kai(line, "happy", run);
    if (st.art) { await sleep(250); alive(run); push({ t: "art", art: st.art }); await sleep(450); alive(run); }
    await kai(st.ask, "smug", run);
    const order = shuffled(st.options.length);
    const k = await ask({ kind: "answers", items: order.map(i => st.options[i]) }); alive(run);
    const o = st.options[order[k]];
    push({ t: "me", icon: o.icon, text: o.label });
    const b0 = S.m, m1 = G.applyFx(b0, o.fx); S.m = m1;
    await kai(o.re, "happy", run);
    flashMeters(b0, m1);
    const d1 = deltas(b0, m1); if (d1.length) push({ t: "sys", d: d1 });
    const rec = { d: st.id, o: o.id, l: typeof o.lvl === "number" ? o.lvl : null, s: !!o.safe, inc: false, disc: o.disc || null, why: null, icon: o.icon,
      pos: k, ord: order.map(i => st.options[i].id).join("") };
    if (o.inc && Math.random() < o.inc.p) {
      rec.inc = true;
      await sleep(600); alive(run);
      if (o.inc.from) { push({ t: "other", from: o.inc.from, text: o.inc.text }); await sleep(500); alive(run); }
      if (o.inc.kai) await kai(o.inc.kai, "oops", run);
      const b1 = S.m; S.m = G.applyFx(b1, o.inc.fx);
      flashMeters(b1, S.m);
      const d2 = deltas(b1, S.m); if (d2.length) push({ t: "sys", d: d2 });
    }
    S.ch.push(rec);
    if (st.why && typeof o.lvl === "number") {
      const dir = o.lvl >= 4 ? "give" : "keep";
      await kai(dir === "give" ? UI.whyGiveAsk : UI.whyKeepAsk, "think", run);
      const wo = shuffled(G.WHY[dir].length), items = wo.map(i => G.WHY[dir][i]);
      const w = await ask({ kind: "chips", items, skip: true }); alive(run);
      if (w >= 0) { rec.why = items[w].id; push({ t: "me", text: { de: items[w].de, en: items[w].en } }); }
    } else if (st.why) { S.whyMissed = (S.whyMissed || 0) + 1; renderHead(); }
    push({ t: "fact", text: st.fact });
    await ask({ kind: "next" }); alive(run);
  }
  async function side(st, run) {
    for (const line of st.kai) await kai(line, "wink", run);
    const cond = Math.random() < 0.5 ? "ki" : "mensch";
    await sleep(250); alive(run);
    push({ t: "art", art: st.art, cond });

  async function finish(run) {
    if (S.rn === 1 && !isKid()) await profilePost(run);
    const e = G.endingOf(S.m, S.ch);
    const m = {}; for (const k in S.m) m[k] = Math.round(S.m[k]);
    const ts = Date.now();
    const doc = { id: S.sid + "-" + ts, v: 3, ts, day: dayStr(), sid: S.sid, rn: S.rn, sc: S.sc, lang, dev: KIOSK ? "maus" : "touch",
      prof: Object.assign({}, S.prof || {}), ch: S.ch.map(c => ({ d: c.d, o: c.o, l: c.l, s: c.s, inc: c.inc, disc: c.disc, why: c.why, pos: c.pos, ord: c.ord })),
      sw: S.sw, end: e.id, m, dur: Math.round((Date.now() - S.t0) / 1000) };

    clearTimeout(resultTimer);

      if (isKid()) { await kai(UI.kidAgain, "happy", r); await play("kids", r); return; }
      await kai(UI.hi3, "happy", r);
      const id = await ask({ kind: "scen" }); alive(r);

  /* Kiosk: am Laptop nach Inaktivität neu starten */
  let idleTimer = null, resultTimer = null;
  function armResultTimer() { clearTimeout(resultTimer); resultTimer = setTimeout(() => { if (route() === "spiel") startNew(); }, 90000); }
  function resetIdle() {
    if (!KIOSK) return;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (route() === "spiel" && S && S.started) startNew(); }, 120000);
    if (S && S.dock && S.dock.spec.kind === "end") armResultTimer();
  }
  ["pointerdown", "keydown"].forEach(e => document.addEventListener(e, resetIdle, { passive: true }));

  document.addEventListener("keydown", ev => {
    if (route() === "spiel" && S && !S.started && ev.key === "Enter" && !(ev.target && ev.target.tagName === "BUTTON")) { ev.preventDefault(); beginGame(); return; }
    if (route() !== "spiel" || !S || !S.dock || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    const sp = S.dock.spec, num = parseInt(ev.key, 10);
    if (sp.kind === "scen" && num >= 1 && num <= G.SCENARIOS.length) { ev.preventDefault(); resolveDock(G.SCENARIOS[num - 1].id); }
    else if ((sp.kind === "answers" || sp.kind === "chips") && num >= 1 && num <= sp.items.length) { ev.preventDefault(); resolveDock(num - 1); }
    else if (sp.kind === "chips" && sp.skip && num === 0) { ev.preventDefault(); resolveDock(-1); }
    else if (sp.kind === "end" && (num === 1 || num === 2 || ev.key === "Enter")) {
      if (ev.target && ev.target.tagName === "BUTTON" && ev.key === "Enter") return;
      ev.preventDefault(); const vals = KIOSK ? ["person", "again"] : ["again"]; const v = vals[(num || 1) - 1]; if (v) resolveDock(v);
    }
    else if (sp.kind === "next" && (ev.key === "Enter" || ev.key === " " || ev.key === "ArrowRight")) { ev.preventDefault(); resolveDock("next"); }
  });

  /* ---------- Statistik ---------- */
  let statsDay = "today";
  function hrow(label, p, sub) {
    return `<div class="hrow"><span>${label}${sub ? `<small>${sub}</small>` : ""}</span><span class="hbar"><i style="width:${p}%"></i></span><span class="num">${p} %</span></div>`;
  }
  function aggregate(list) {
    const binding = {};
    G.SCENARIOS.forEach(s => s.steps.forEach(st => { if (st.type === "verbindlich") binding[st.id] = { sc: s, st, n: 0, alone: 0 }; }));
    const A = { n: list.length, aloneAny: 0, ends: {}, why: { keep: {}, give: {} }, exp: { ki: [0, 0], mensch: [0, 0] }, use: {}, alter: {}, rolle: {}, pre: {}, post: {}, binding };
    list.forEach(p => {
      A.ends[p.end] = (A.ends[p.end] || 0) + 1;
      let any = false;
      (p.ch || []).forEach(c => {
        const b = binding[c.d]; if (b) { b.n++; if (c.l === 5) { b.alone++; any = true; } }
        if (c.why) { const dir = c.l >= 4 ? "give" : "keep"; A.why[dir][c.why] = (A.why[dir][c.why] || 0) + 1; }
      });
      if (any) A.aloneAny++;
      const first = !p.rn || p.rn === 1;
      if (first && p.sw && A.exp[p.sw.cond]) { A.exp[p.sw.cond][1]++; if (p.sw.ans === "fest") A.exp[p.sw.cond][0]++; }
      const pr = p.prof || {};
      if (first && pr.haltung && pr.haltung2) { A.pre[pr.haltung] = (A.pre[pr.haltung] || 0) + 1; A.post[pr.haltung2] = (A.post[pr.haltung2] || 0) + 1; }
      const u = pr.kinutzung || "keine"; A.use[u] = A.use[u] || [0, 0]; A.use[u][1]++; if (any) A.use[u][0]++;
      if (first && pr.alter) A.alter[pr.alter] = (A.alter[pr.alter] || 0) + 1;
      if (first && pr.rolle) A.rolle[pr.rolle] = (A.rolle[pr.rolle] || 0) + 1;
    });
    return A;
  }
  function viewStats() {
    const list = Store.all().filter(p => p.v === 3 && (statsDay === "all" || p.day === dayStr()));
    const A = aggregate(list);
    const st = Store.status();
    const status = st === "loading" ? T(UI.loading) : st === "slow" ? T(UI.slow) : st === "offline" ? T(UI.offline) : "";
    const prof = id => G.PROFILE_PRE.concat(G.PROFILE_POST).find(q => q.id === id);
    const distRows = (id, counts) => { const tot = Object.values(counts).reduce((a, b) => a + b, 0); return tot ? prof(id).opts.map(o => hrow(esc(t(o)), pct(counts[o.id] || 0, tot))).join("") + `<p class="note">${T(UI.n)} = ${tot}</p>` : `<p class="note">–</p>`; };
    const whyRows = dir => { const tot = Object.values(A.why[dir]).reduce((a, b) => a + b, 0); return tot ? G.WHY[dir].map(o => hrow(esc(t(o)), pct(A.why[dir][o.id] || 0, tot))).join("") : `<p class="note">–</p>`; };
    const bRows = Object.values(A.binding).filter(b => b.n).sort((x, y) => y.alone / y.n - x.alone / x.n)
      .map(b => hrow(T(b.st.short), pct(b.alone, b.n), `${T(b.sc.name)} · ${T(UI.n)} = ${b.n}`)).join("");
    const useRows = prof("kinutzung").opts.map(o => { const u = A.use[o.id]; return u ? hrow(esc(t(o)), pct(u[0], u[1]), `${T(UI.n)} = ${u[1]}`) : ""; }).join("");
    return `<section class="stats">
      <div class="stats-head">
        <h1>${T(UI.statsTitle)}</h1>
        <div class="tools">
          <button class="pill" data-day="today" aria-pressed="${statsDay === "today"}">${T(UI.today)}</button>
          <button class="pill" data-day="all" aria-pressed="${statsDay === "all"}">${T(UI.allDays)}</button>
          <button class="pill" id="sLang">${lang === "de" ? "EN" : "DE"}</button>
          <a class="pill" href="#spiel" style="text-decoration:none;color:inherit">${T(UI.backGame)}</a>
          <button class="pill" id="expJson">${T(UI.exportJson)}</button><button class="pill" id="expCsv">${T(UI.exportCsv)}</button>
        </div>
      </div>
      ${(window.BSW_CONFIG || {}).local ? `<p class="note">${T(UI.localNote)}</p>` : ""}
      ${status ? `<p class="note">${status}</p>` : ""}
      ${A.n === 0 ? `<div class="panel"><p>${T(UI.noData)}</p></div>` : `
      <div class="tiles">
        <div class="tile"><span class="big">${A.n}</span><span class="cap">${T(UI.rounds)}</span></div>
        <div class="tile"><span class="big">${pct(A.aloneAny, A.n)} %</span><span class="cap">${T(UI.aloneAny)}</span><span class="cap"><b>${T(UI.aloneInt)}</b></span></div>
        <div class="tile"><span class="cap"><b>${T(UI.expTitle)}</b></span>
          <div class="vs"><div><b>${pct(A.exp.ki[0], A.exp.ki[1])} %</b>🤖 ${T(UI.expKi)}<br><span class="note">${T(UI.n)} = ${A.exp.ki[1]}</span></div>
          <div><b>${pct(A.exp.mensch[0], A.exp.mensch[1])} %</b>👤 ${T(UI.expMensch)}<br><span class="note">${T(UI.n)} = ${A.exp.mensch[1]}</span></div></div>
          <span class="note">${T(UI.expCap)} · ${T(UI.expNote)}</span></div>
      </div>
      <div class="panels">
        <div class="panel"><h2>${T(UI.aloneTitle)}</h2>${bRows}</div>
        <div class="panel"><h2>${T(UI.whyTitle)}</h2><p class="note"><b>${T(UI.whyKeep)}</b></p>${whyRows("keep")}<p class="note"><b>${T(UI.whyGive)}</b></p>${whyRows("give")}</div>
        <div class="panel"><h2>${T(UI.endsTitle)}</h2>${G.ENDINGS.map(e => hrow(e.emoji + " " + T(e.name), pct(A.ends[e.id] || 0, A.n))).join("")}</div>
        <div class="panel"><h2>${T(UI.useTitle)}</h2><p class="note">${T(UI.useNote)}</p>${useRows || `<p class="note">–</p>`}</div>
        <div class="panel"><h2>${T(UI.prePostTitle)}</h2>${prePost(A)}</div>
        <div class="panel"><h2>${T(UI.ageTitle)}</h2>${distRows("alter", A.alter)}</div>
        <div class="panel"><h2>${T(UI.roleTitle)}</h2>${distRows("rolle", A.rolle)}</div>
      </div>`}
    </section>`;
  }
  function prePost(A) {
    const n = Object.values(A.pre).reduce((a, b) => a + b, 0);
    if (!n) return `<p class="note">–</p>`;
    return G.PROFILE_PRE[1].opts.map(o => `<div class="hrow"><span>${esc(t(o))}</span><span style="display:grid;gap:3px"><span class="hbar"><i style="width:${pct(A.pre[o.id] || 0, n)}%;background:#b3b3b3"></i></span><span class="hbar"><i style="width:${pct(A.post[o.id] || 0, n)}%"></i></span></span><span class="num" style="white-space:nowrap">${pct(A.pre[o.id] || 0, n)} → ${pct(A.post[o.id] || 0, n)}</span></div>`).join("")
      + `<p class="note">% ${T(UI.before)} (grau) → ${T(UI.after)} (dunkel) · ${T(UI.n)} = ${n}</p>`;
  }
  function dl(name, text, type) {
    const b = new Blob([text], { type }); const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function toCsv(list) {
    const pk = ["alter", "haltung", "gruppe", "rolle", "betrieb", "kinutzung", "haltung2"];
    const head = ["id", "ts", "day", "rn", "sc", "lang", "dev", "end", "dur", "m_z", "m_v", "m_r", "m_a", "sw_d", "sw_cond", "sw_ans"].concat(pk.map(k => "prof_" + k), ["n_choices", "choices_json"]);
    const q = v => { const s = v === undefined || v === null ? "" : (typeof v === "object" ? JSON.stringify(v) : String(v)); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = list.map(p => [p.id, p.ts, p.day, p.rn, p.sc, p.lang, p.dev, p.end, p.dur, (p.m || {}).z, (p.m || {}).v, (p.m || {}).r, (p.m || {}).a, (p.sw || {}).d, (p.sw || {}).cond, (p.sw || {}).ans]
      .concat(pk.map(k => (p.prof || {})[k]), [(p.ch || []).length, p.ch || []]).map(q).join(";"));
    return "\ufeff" + head.join(";") + "\n" + rows.join("\n");
  }
  function bindStats() {
    const ej = document.getElementById("expJson"), ec = document.getElementById("expCsv");
    const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    if (ej) ej.onclick = () => dl("bsw-runden-" + stamp() + ".json", JSON.stringify(Store.all(), null, 1), "application/json");
    if (ec) ec.onclick = () => dl("bsw-runden-" + stamp() + ".csv", toCsv(Store.all()), "text/csv;charset=utf-8");
    root.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { statsDay = b.dataset.day; render(); });
    const l = document.getElementById("sLang"); if (l) l.onclick = () => { lang = lang === "de" ? "en" : "de"; try { localStorage.setItem("bsw-lang", lang); } catch (e) {} render(); };
  }
  Store.onChange(() => { if (route() === "statistik") render(); });

  window.addEventListener("hashchange", () => { render(); });
  window.__bsw = { getState: () => S, aggregate, resolveDock, Store };

  newSession(null);
  render();
})();

</script>
</body>
</html>
