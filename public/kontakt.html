<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f58220">
<link rel="icon" href="data:,">
<title>KI-InnoX · In Kontakt bleiben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  /* IFAF-Design: Orange #F58220, Text #212121, Grau #58595B, Hellgrau #F1F1F1 (aus ifaf-berlin.de). Einspaltiges Formular. */
  --orange: #f58220; --orange-l: #fff1e6; --ink: #212121; --muted: #5f6064; --line: #dcdcdc; --bg: #f1f1f1; --bad: #c0392b; --good: #2e7d5b;
  --font: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45; }
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }
.card { background: #fff; border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.top svg { width: 200px; max-width: 60%; height: auto; }
.lang { display: flex; gap: 6px; }
.pill { border: 2px solid var(--ink); background: transparent; border-radius: 999px; padding: 3px 12px; font: inherit; font-weight: 800; font-size: .85em; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); color: #fff; }
h1 { margin: 0; font-weight: 900; font-size: 1.7em; line-height: 1.1; text-wrap: balance; }
h1 mark { background: var(--orange); color: #fff; border-radius: 6px; padding: 0 .12em; }
p { margin: 0; }
.lead { color: var(--muted); }
.note { background: var(--orange-l); border-left: 5px solid var(--orange); border-radius: 10px; padding: 10px 12px; font-size: .92em; }
form { display: grid; gap: 14px; }
label.f { display: grid; gap: 4px; font-weight: 800; font-size: .95em; }
label.f small { font-weight: 400; color: var(--muted); }
input[type=email], input[type=text] { font: inherit; padding: 11px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; }
input:focus-visible, button:focus-visible { outline: 3px solid #8076a0; outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
fieldset { border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0; display: grid; gap: 8px; }
legend { font-weight: 800; padding: 0 4px; font-size: .95em; }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: .95em; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--orange); }
.submit { background: var(--orange); color: var(--ink); border: none; border-radius: 14px; padding: 14px; font: inherit; font-weight: 900; font-size: 1.1em; cursor: pointer; }
.submit[disabled] { opacity: .6; cursor: wait; }
.err { color: var(--bad); font-weight: 700; font-size: .92em; }
.ok { display: grid; gap: 10px; text-align: center; }
.ok b { font-size: 1.3em; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
details { background: #fff; border-radius: 14px; padding: 12px 16px; font-size: .9em; }
summary { font-weight: 800; cursor: pointer; }
details h3 { font-size: 1em; margin: 12px 0 2px; }
details p, details li { color: #333; }
details ul { margin: 4px 0; padding-left: 18px; }
footer { text-align: center; color: var(--muted); font-size: .8em; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="top"><div id="logo"></div><div class="lang"><button class="pill" data-l="de">DE</button><button class="pill" data-l="en">EN</button></div></div>
    <h1 id="h"></h1>
    <p class="lead" id="lead"></p>
    <p class="note" id="sep"></p>
    <form id="f" novalidate>
      <label class="f" for="email"><span id="lEmail"></span><input id="email" name="email" type="email" autocomplete="email" required maxlength="200"></label>
      <div class="row2">
        <label class="f" for="vorname"><span id="lVor"></span><input id="vorname" name="vorname" type="text" autocomplete="given-name" maxlength="80"></label>
        <label class="f" for="nachname"><span id="lNach"></span><input id="nachname" name="nachname" type="text" autocomplete="family-name" maxlength="80"></label>
      </div>
      <label class="f" for="organisation"><span id="lOrg"></span><input id="organisation" name="organisation" type="text" autocomplete="organization" maxlength="120"></label>
      <fieldset>
        <legend id="lZw"></legend>
        <label class="check"><input type="checkbox" name="zwecke" value="workshops" id="z1"><span id="z1t"></span></label>
        <label class="check"><input type="checkbox" name="zwecke" value="befragung" id="z2"><span id="z2t"></span></label>
        <label class="check"><input type="checkbox" name="zwecke" value="news" id="z3"><span id="z3t"></span></label>
      </fieldset>
      <label class="check"><input type="checkbox" id="age16"><span id="age16t"></span></label>
      <label class="check"><input type="checkbox" id="consent"><span id="consentt"></span></label>
      <div class="hp" aria-hidden="true"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
      <p class="err" id="err" role="alert" hidden></p>
      <button class="submit" id="btn" type="submit"></button>
    </form>
    <div class="ok" id="ok" hidden><b id="okT"></b><p id="okP"></p></div>
  </section>
  <details id="ds"></details>
  <footer id="foot"></footer>
</main>
<script src="logo.js"></script>
<script>
(function () {
  "use strict";
  const MAIL = "falko.carl@hwr-berlin.de";
  const TX = {
    de: {
      h: 'In Kontakt <mark>bleiben</mark>', lead: "Wir suchen Menschen und Betriebe, die bei KI-InnoX mitmachen möchten. Die Eintragung ist freiwillig.",
      sep: "🔒 Deine Antworten im Spiel bleiben anonym. Diese Kontaktdaten speichern wir getrennt davon, ohne Uhrzeit und ohne Verbindung zum Spiel. Wir können also nicht nachvollziehen, wer was gespielt hat.",
      lEmail: "E-Mail-Adresse", lVor: "Vorname <small>(freiwillig)</small>", lNach: "Nachname <small>(freiwillig)</small>", lOrg: "Organisation oder Betrieb <small>(freiwillig)</small>",
      lZw: "Wofür dürfen wir dich kontaktieren?",
      z1t: "Einladungen zu Workshops und zum Hackathon", z2t: "Anfragen für Befragungen oder Interviews, auch zu einem Realexperiment mit KI-Agenten", z3t: "Neuigkeiten aus dem Projekt KI-InnoX",
      age16t: "Ich bin mindestens 16 Jahre alt.",
      consentt: `Ich willige ein, dass die HWR Berlin meine Angaben für die gewählten Zwecke im Projekt KI-InnoX speichert und mich kontaktiert. Die Daten liegen auf einem Server in Nürnberg (Deutschland) und werden spätestens nach Projektende am 31.12.2027 gelöscht. Ich kann die Einwilligung jederzeit per E-Mail an ${MAIL} widerrufen.`,
      btn: "Eintragen", sending: "Wird gespeichert …",
      eEmail: "Bitte gib eine gültige E-Mail-Adresse an.", eZw: "Bitte wähle mindestens einen Zweck aus.", eCons: "Bitte bestätige Alter und Einwilligung.", eNet: "Das hat nicht geklappt. Bitte versuch es gleich noch einmal oder sprich uns am Stand an.",
      okT: "Danke, du bist eingetragen! 🙌", okP: `Du kannst deine Einwilligung jederzeit per E-Mail an ${MAIL} widerrufen. Dann löschen wir deine Daten.`,
      foot: "KI-InnoX · ein Projekt des IFAF Berlin mit HWR Berlin, HTW Berlin und ASH Berlin",
      ds: `<summary>Datenschutzhinweise</summary>
        <h3>Verantwortlich</h3><p>Hochschule für Wirtschaft und Recht Berlin (HWR Berlin), vertreten durch den Präsidenten, Badensche Straße 52, 10825 Berlin. Ansprechperson im Projekt KI-InnoX: Falko Carl, ${MAIL}.</p>
        <h3>Datenschutzbeauftragter</h3><p>Behördlicher Datenschutzbeauftragter der HWR Berlin, datenschutz@hwr-berlin.de</p>
        <h3>Welche Daten</h3><p>E-Mail-Adresse; freiwillig Vor- und Nachname sowie Organisation; die gewählten Zwecke; das Datum der Eintragung. Wir speichern keine IP-Adresse, keine Uhrzeit und keine Verbindung zu deinen Antworten im Spiel.</p>
        <h3>Zweck</h3><p>Kontaktaufnahme im Forschungsprojekt KI-InnoX ausschließlich für die von dir gewählten Zwecke.</p>
        <h3>Rechtsgrundlage</h3><p>Deine Einwilligung (Art. 6 Abs. 1 lit. a DSGVO). Die Eintragung ist freiwillig; das Spiel kannst du auch ohne sie nutzen.</p>
        <h3>Speicherort und Empfänger</h3><p>Server der Hetzner Online GmbH im Rechenzentrum Nürnberg (Deutschland), im Auftrag verarbeitet. Keine Weitergabe an Dritte, keine Übermittlung in Länder außerhalb der EU.</p>
        <h3>Speicherdauer</h3><p>Bis zum Ende des Projekts KI-InnoX (31.12.2027), danach werden die Daten gelöscht. Bei Widerruf löschen wir sie sofort.</p>
        <h3>Deine Rechte</h3><ul><li>Widerruf der Einwilligung jederzeit mit Wirkung für die Zukunft (Art. 7 Abs. 3 DSGVO), per E-Mail an ${MAIL}</li><li>Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung und Datenübertragbarkeit (Art. 15 bis 20 DSGVO)</li><li>Beschwerde bei der Berliner Beauftragten für Datenschutz und Informationsfreiheit, Alt-Moabit 59–61, 10555 Berlin</li></ul>
        <p style="margin-top:10px;color:#5f6064">Stand: November 2026</p>`
    },
    en: {
      h: 'Stay in <mark>touch</mark>', lead: "We're looking for people and businesses who would like to take part in KI-InnoX. Signing up is voluntary.",
      sep: "🔒 Your answers in the game stay anonymous. We store these contact details separately, without a time stamp and without any link to the game. So we cannot tell who played what.",
      lEmail: "E-mail address", lVor: "First name <small>(optional)</small>", lNach: "Last name <small>(optional)</small>", lOrg: "Organisation or business <small>(optional)</small>",
      lZw: "What may we contact you about?",
      z1t: "Invitations to workshops and the hackathon", z2t: "Requests to take part in surveys or interviews, including a real-world experiment with AI agents", z3t: "News from the KI-InnoX project",
      age16t: "I am at least 16 years old.",
      consentt: `I consent to HWR Berlin storing my details for the selected purposes in the KI-InnoX project and contacting me. The data is stored on a server in Nuremberg (Germany) and deleted at the latest when the project ends on 31 Dec 2027. I can withdraw my consent at any time by e-mail to ${MAIL}.`,
      btn: "Sign up", sending: "Saving …",
      eEmail: "Please enter a valid e-mail address.", eZw: "Please choose at least one purpose.", eCons: "Please confirm your age and consent.", eNet: "That didn't work. Please try again in a moment or talk to us at the stand.",
      okT: "Thanks, you're signed up! 🙌", okP: `You can withdraw your consent at any time by e-mail to ${MAIL}. We will then delete your data.`,
      foot: "KI-InnoX · a project of IFAF Berlin with HWR Berlin, HTW Berlin and ASH Berlin",
      ds: `<summary>Privacy information</summary>
        <h3>Controller</h3><p>Hochschule für Wirtschaft und Recht Berlin (HWR Berlin), represented by its President, Badensche Straße 52, 10825 Berlin, Germany. Contact in the KI-InnoX project: Falko Carl, ${MAIL}.</p>
        <h3>Data protection officer</h3><p>Data protection officer of HWR Berlin, datenschutz@hwr-berlin.de</p>
        <h3>What data</h3><p>E-mail address; optionally first and last name and organisation; the purposes you choose; the date of sign-up. We store no IP address, no time stamp and no link to your answers in the game.</p>
        <h3>Purpose</h3><p>Contacting you within the KI-InnoX research project, only for the purposes you chose.</p>
        <h3>Legal basis</h3><p>Your consent (Art. 6(1)(a) GDPR). Signing up is voluntary; you can use the game without it.</p>
        <h3>Storage and recipients</h3><p>Server of Hetzner Online GmbH in its Nuremberg data centre (Germany), processed on our behalf. No disclosure to third parties, no transfer outside the EU.</p>
        <h3>Retention</h3><p>Until the end of the KI-InnoX project (31 Dec 2027), then deleted. If you withdraw consent, we delete the data immediately.</p>
        <h3>Your rights</h3><ul><li>Withdraw consent at any time with effect for the future (Art. 7(3) GDPR), by e-mail to ${MAIL}</li><li>Access, rectification, erasure, restriction of processing and data portability (Art. 15–20 GDPR)</li><li>Complaint to the Berlin Commissioner for Data Protection and Freedom of Information, Alt-Moabit 59–61, 10555 Berlin</li></ul>
        <p style="margin-top:10px;color:#5f6064">As of November 2026</p>`
    }
  };
  let lang = (navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en";
  const q = new URLSearchParams(location.search).get("lang"); if (q === "de" || q === "en") lang = q;
  const $ = id => document.getElementById(id);
  function apply() {
    const t = TX[lang]; document.documentElement.lang = lang;
    ["h", "lEmail", "lVor", "lNach", "lOrg", "ds"].forEach(k => $(k).innerHTML = t[k]);
    ["lead", "sep", "lZw", "z1t", "z2t", "z3t", "age16t", "consentt", "okT", "okP", "foot"].forEach(k => $(k).textContent = t[k]);
    $("btn").textContent = t.btn;
    document.querySelectorAll("[data-l]").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  }
  $("logo").innerHTML = window.IFAF_LOGO || "IFAF Berlin";
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { lang = b.dataset.l; apply(); });
  apply();
  $("f").addEventListener("submit", async ev => {
    ev.preventDefault();
    const t = TX[lang], err = $("err");
    const email = $("email").value.trim();
    const zwecke = [...document.querySelectorAll("input[name=zwecke]:checked")].map(x => x.value);
    let msg = "";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) msg = t.eEmail;
    else if (!zwecke.length) msg = t.eZw;
    else if (!$("age16").checked || !$("consent").checked) msg = t.eCons;
    if (msg) { err.textContent = msg; err.hidden = false; return; }
    err.hidden = true;
    const btn = $("btn"); btn.disabled = true; btn.textContent = t.sending;
    try {
      const r = await fetch("/api/contacts", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, vorname: $("vorname").value, nachname: $("nachname").value, organisation: $("organisation").value,
          zwecke, age16: true, consent: true, lang, website: $("website").value }) });
      if (!r.ok) throw new Error(String(r.status));
      $("f").hidden = true; $("ok").hidden = false;
    } catch (e) {
      err.textContent = t.eNet; err.hidden = false; btn.disabled = false; btn.textContent = t.btn;
    }
  });
})();
</script>
</body>
</html>
